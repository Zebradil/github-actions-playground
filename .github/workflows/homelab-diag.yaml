name: homelab diag

on:
  push:
    branches:
      - wt/*-homelab-hello

jobs:
  diag:
    runs-on: homelab
    steps:
      - name: Before setup-nix
        run: |
          nix config show substituters
          nix config show trusted-public-keys
          nix-store -r --dry-run /nix/store/lncjyfgmlkp9ziddalwb56nq4s5m11mp-libgpg-error-1.61 2>&1 | head -5

      - uses: zebradil/nix-ci/.github/actions/setup-nix@wt/261126-020522-leaves-push-set
        with:
          extra-substituters: https://znix.zebradil.dev
          extra-trusted-public-keys: znix.zebradil.dev:nvr0OQFRddbHGopQbyLbLXQnntFBDKp23tqQq+msppw=

      - name: After setup-nix
        run: |
          echo "NIX_USER_CONF_FILES=$NIX_USER_CONF_FILES"
          nix config show substituters
          nix config show trusted-public-keys
          nix config show require-sigs
          nix-store -r --dry-run /nix/store/lncjyfgmlkp9ziddalwb56nq4s5m11mp-libgpg-error-1.61 2>&1 | head -5
          curl -sS -o /dev/null -w 'cache.nixos.org %{http_code}\n' https://cache.nixos.org/lncjyfgmlkp9ziddalwb56nq4s5m11mp.narinfo
          ls -la ~/.cache/nix 2>&1 | head
