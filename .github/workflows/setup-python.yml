name: Setup Python 3.14 and Verify

on: push

jobs:
  setup-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check the current Python version
        run: python --version
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Verify the Python version after setup
        run: python --version
