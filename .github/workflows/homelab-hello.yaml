name: homelab hello

on:
  push:
    branches:
      - wt/*-homelab-hello

jobs:
  hello:
    runs-on: homelab
    steps:
      - name: Show where the job runs
        run: |
          echo "runner: $RUNNER_NAME"
          uname -a
          id
          # `! cmd` and `a && b` never fail a `bash -e` step.
          if command -v sudo; then echo "sudo present"; exit 1; fi
          if [ -e /var/run/secrets/kubernetes.io/serviceaccount/token ]; then echo "service account token mounted"; exit 1; fi

      - name: Network policy
        run: |
          curl -sS -m 10 -o /dev/null https://kasha.lan.zebradil.dev/nix-cache-info
          echo "kasha reachable"
          for target in http://192.168.0.101:5000/nix-cache-info https://10.43.0.1/; do
            start=$(date +%s)
            if curl -sSk -m 10 -o /dev/null "$target"; then echo "$target reachable"; exit 1; fi
            echo "$target blocked after $(( $(date +%s) - start ))s"
          done

      - uses: actions/checkout@v6

      - name: Tool versions
        run: |
          nix --version
          command -v nix-fast-build
          docker buildx version
          git --version

      - name: Build on daddy as nixci
        run: |
          ls -ln /etc/nixci/
          nix store info --store "$NIX_CI_STORE"
          time nix build --no-link --print-out-paths --eval-store auto --store "$NIX_CI_STORE" github:zebradil/kasha#packages.x86_64-linux.kasha

  nix-ci:
    strategy:
      fail-fast: false
      matrix:
        runner: [homelab, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: zebradil/kasha

      # Throwaway key: proves the push signs paths built in the remote store.
      - id: key
        run: |
          if command -v nix >/dev/null; then
            nix key generate-secret --key-name nix-ci-test-1 > "$RUNNER_TEMP/test.sec"
          else
            # Hosted runners have no Nix before setup-nix: same format, seed then public key.
            python3 -c "import cryptography" 2>/dev/null || pip install --quiet --user --break-system-packages cryptography
            python3 - > "$RUNNER_TEMP/test.sec" <<'PY'
          import base64
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization as s
          k = Ed25519PrivateKey.generate()
          raw = lambda o: o.private_bytes(s.Encoding.Raw, s.PrivateFormat.Raw, s.NoEncryption()) if o is k else o.public_bytes(s.Encoding.Raw, s.PublicFormat.Raw)
          print("nix-ci-test-1:" + base64.b64encode(raw(k) + raw(k.public_key())).decode(), end="")
          PY
          fi
          {
            echo "public=nix-ci-test-1:$(cut -d: -f2 "$RUNNER_TEMP/test.sec" | base64 -d | tail -c 32 | base64 -w0)"
            echo "secret=$(cat "$RUNNER_TEMP/test.sec")"
          } >> "$GITHUB_OUTPUT"

      - uses: zebradil/nix-ci/.github/actions/setup-nix@wt/261125-235823-remote-store
        with:
          signing-key: ${{ steps.key.outputs.secret }}
          extra-trusted-public-keys: ${{ steps.key.outputs.public }}

      - name: attr-set
        uses: zebradil/nix-ci/.github/actions/build@wt/261125-235823-remote-store
        with:
          attr: checks.x86_64-linux
          cache-s3-url: file:///tmp/nix-ci-test-cache
          kasha-manifest: false

      - name: uncached-leaves
        uses: zebradil/nix-ci/.github/actions/build@wt/261125-235823-remote-store
        with:
          attr: packages.x86_64-linux.kasha
          strategy: uncached-leaves
          cache-s3-url: file:///tmp/nix-ci-test-cache
          kasha-manifest: false

      - name: Pushed paths carry the test signature
        run: |
          n=$(ls /tmp/nix-ci-test-cache/*.narinfo | wc -l)
          signed=$(grep -l '^Sig: nix-ci-test-1:' /tmp/nix-ci-test-cache/*.narinfo | wc -l)
          echo "narinfos: $n, signed by the test key: $signed"
          [ "$n" -gt 0 ] && [ "$n" -eq "$signed" ]
          echo "NIX_USER_CONF_FILES=${NIX_USER_CONF_FILES:-}"
          nix config show experimental-features
