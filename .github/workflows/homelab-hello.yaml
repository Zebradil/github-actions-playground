name: homelab hello

on:
  push:
    branches:
      - wt/*-homelab-hello

jobs:
  hello:
    runs-on: homelab
    steps:
      - name: Show where the job runs
        run: |
          echo "runner: $RUNNER_NAME"
          uname -a
          id
          command -v sudo || echo "no sudo"

      - uses: actions/checkout@v6

      - name: Tool versions
        run: |
          nix --version
          command -v nix-fast-build
          docker buildx version
          git --version

      - name: Build on daddy as nixci
        env:
          NIXCI_SSH_KEY: ${{ secrets.NIXCI_SSH_KEY }}
        run: |
          key="$RUNNER_TEMP/nixci"
          printf '%s\n' "$NIXCI_SSH_KEY" > "$key"
          chmod 600 "$key"
          store="ssh-ng://nixci@192.168.0.101?ssh-key=$key&base64-ssh-public-host-key=c3NoLWVkMjU1MTkgQUFBQUMzTnphQzFsWkRJMU5URTVBQUFBSUl1blRtR0dEODNXS290eVNWM3ZCRDVhRC9sdVU4cDFzWUN1OFV4bHl2d0s="
          nix store info --store "$store"
          time nix build --no-link --print-out-paths --eval-store auto --store "$store" github:zebradil/kasha#packages.x86_64-linux.kasha
